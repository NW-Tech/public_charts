apiVersion: apps.emqx.io/v2beta1
kind: EMQX
metadata:
  name: {{ include "emqx-broker.fullname" . }}
spec:
  image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
  coreTemplate:
    spec:
      replicas: {{ .Values.replicaCount }}
      {{- with .Values.resources }}
      resources:
        {{- toYaml . | nindent 8 }}
      {{- end }}  
      {{- if .Values.persistence.enabled }}
      {{- with .Values.persistence }}
      volumeClaimTemplates:
      ## more information about storage classes: https://cloud.google.com/kubernetes-engine/docs/concepts/persistent-volumes#storageclasses
        storageClassName: {{ .storageClass }}
        resources:
          requests:
            storage: {{ .size }}
            
        accessModes:
          {{- toYaml .accessModes | nindent 10 }}
      {{- end }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- if .Values.topologySpreadConstraints }}
      ## more information about spreading pods across zones: https://kubernetes.io/docs/concepts/scheduling-eviction/topology-spread-constraints/
      topologySpreadConstraints:
        {{- $defaultSelector := dict "matchLabels" (include "emqx-broker.corePodSelectorLabels" . | fromYaml) }}
        {{- range .Values.topologySpreadConstraints }}
        {{- $constraint := deepCopy . }}
        {{- if not $constraint.labelSelector }}
        {{- $_ := set $constraint "labelSelector" $defaultSelector }}
        {{- end }}
        {{- toYaml (list $constraint) | nindent 8 }}
        {{- end }}
      {{- end }}
      {{- with .Values.podSecurityContext }}
      podSecurityContext:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.securityContext }}
      securityContext:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }} 
      {{- end }}

  {{- with .Values.dashboardServiceTemplate }}
  dashboardServiceTemplate:
    spec:
      ## more information about load balancer: https://cloud.google.com/kubernetes-engine/docs/how-to/internal-load-balancing
      {{- toYaml .spec | nindent 6 }}
    metadata:
      {{- toYaml .metadata | nindent 6 }}
  {{- end }}
    
      ## more information about load balancer: https://cloud.google.com/kubernetes-engine/docs/how-to/internal-load-balancing
  {{- with .Values.listenersServiceTemplate }}
  listenersServiceTemplate:
    spec:
      ## more information about load balancer: https://cloud.google.com/kubernetes-engine/docs/how-to/internal-load-balancing
      {{- toYaml .spec | nindent 6 }}
    metadata:
      {{- toYaml .metadata | nindent 6 }}
  {{- end }}
  {{- with .Values.config }}
  config: 
    {{- toYaml . | nindent 4 }}
  {{- end }}