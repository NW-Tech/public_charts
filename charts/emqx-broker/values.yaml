# Default values for emqx-broker.
# This is a YAML-formatted file.
# Declare variables to be passed into your templates.

# This will set the replicaset count more information can be found here: https://kubernetes.io/docs/concepts/workloads/controllers/replicaset/
replicaCount: 3

# This sets the container image more information can be found here: https://kubernetes.io/docs/concepts/containers/images/
image:
  repository: emqx
  # This sets the pull policy for images.
  pullPolicy: IfNotPresent
  # Overrides the image tag whose default is the chart appVersion.
  tag: "5.8"

# This is for the secrets for pulling an image from a private repository more information can be found here: https://kubernetes.io/docs/tasks/configure-pod-container/pull-image-private-registry/
imagePullSecrets: []
# This is to override the chart name.
nameOverride: ""
fullnameOverride: ""

podSecurityContext: {}
  # fsGroup: 2000

securityContext: {}
  # capabilities:
  #   drop:
  #   - ALL
  # readOnlyRootFilesystem: true
  # runAsNonRoot: true
  # runAsUser: 1000

persistence:
  enabled: true
  storageClass: "standard"
  accessModes:
    - ReadWriteOnce
  size: 10Gi

# This is for setting up a service more information can be found here: https://kubernetes.io/docs/concepts/services-networking/service/
dashboardServiceTemplate:
  # This sets the service type more information can be found here: https://kubernetes.io/docs/concepts/services-networking/service/#publishing-services-service-types
  spec:
    type: LoadBalancer
    loadBalancerIP: "10.11.0.79"
  metadata:
    annotations:
      networking.gke.io/load-balancer-type: Internal

listenersServiceTemplate:
  spec:
    type: LoadBalancer
    loadBalancerIP: "10.11.0.80"
  metadata:
    annotations:
      networking.gke.io/load-balancer-type: Internal

config:
  data: |
    authentication = [
        {
          mechanism = password_based
          backend = built_in_database
          password_hash_algorithm {
            name = sha256
            salt_position = suffix
          }
          user_id_type = "username"
        }
      ]

resources:
  limits:
    cpu: 1000m
    memory: 1024Mi
  requests:
    cpu: 500m
    memory: 512Mi

# Deploys emqx-exporter alongside the broker, plus the ServiceMonitor and PodMonitor
# scraped by the Prometheus operator.
# More information can be found here: https://github.com/emqx/emqx-exporter
#
# When enabled, all four credentials below are required: they are rendered into the
# exporter's config Secret. Supply them from your own release values, never here.
# `dashboardApiKey` / `dashboardApiSecret` come from the EMQX dashboard API key,
# `probeUsername` / `probePassword` from an EMQX user used for the MQTT probe.
monitoring:
  enabled: false
  dashboardApiKey: ""
  dashboardApiSecret: ""
  probeUsername: ""
  probePassword: ""

# This block is for setting up the ingress for more information can be found here: https://kubernetes.io/docs/concepts/services-networking/ingress/
# ingress:
#   enabled: false
#   className: ""
#   annotations: {}
#     # kubernetes.io/ingress.class: nginx
#     # kubernetes.io/tls-acme: "true"
#   hosts:
#     - host: chart-example.local
#       paths:
#         - path: /
#           pathType: ImplementationSpecific
#   tls: []
#   #  - secretName: chart-example-tls
#   #    hosts:
#   #      - chart-example.local

nodeSelector: {}

tolerations: []

affinity: {}

# Spread the EMQX core pods across failure domains.
# More information can be found here: https://kubernetes.io/docs/concepts/scheduling-eviction/topology-spread-constraints/
#
# `labelSelector` is optional: when omitted, the chart injects the labels the EMQX
# operator stamps on this release's core pods, so the constraint cannot accidentally
# match unrelated pods in the namespace. Set it explicitly only to override that.
#
# Note on `whenUnsatisfiable: DoNotSchedule`: with replicaCount 3 the cluster needs
# at least 3 zones with schedulable capacity, otherwise pods stay Pending. Use
# `ScheduleAnyway` for best-effort spreading instead.
#
# To force one core pod per zone:
# topologySpreadConstraints:
#   - maxSkew: 1
#     topologyKey: topology.kubernetes.io/zone
#     whenUnsatisfiable: DoNotSchedule
topologySpreadConstraints: []
