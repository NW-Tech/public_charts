{{- if .Values.podMonitor.enabled }}
{{- $unscrapedWorkers := list }}
{{- range $workerName, $entry := .Values.workers }}
{{- if not (dig "podMonitor" "enabled" true ($entry | default dict)) }}
{{- $unscrapedWorkers = append $unscrapedWorkers $workerName }}
{{- end }}
{{- end }}
apiVersion: monitoring.coreos.com/v1
kind: PodMonitor
metadata:
  name: {{ include "app.fullname" . }}-prometheus-podmonitor
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "app.labels" . | nindent 4 }}
    {{- with .Values.podMonitor.labels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
spec:
  selector:
    matchLabels:
      app.kubernetes.io/instance: {{ .Release.Name }}
    # The app and its workers (see worker-deployment.yaml).
    matchExpressions:
      - key: app.kubernetes.io/name
        operator: In
        values:
          - {{ include "app.name" . }}
          - {{ include "app.workerAppName" . }}
      {{- with $unscrapedWorkers }}
      # Workers with podMonitor.enabled: false; app pods have no such label, so they match.
      - key: python-app.io/worker
        operator: NotIn
        values:
          {{- toYaml . | nindent 10 }}
      {{- end }}

  namespaceSelector:
    matchNames:
      - {{ .Release.Namespace }}

  podMetricsEndpoints:
    {{- range .Values.podMonitor.ports }}
    - port: {{ . }}
      path: {{ $.Values.podMonitor.path }}
      interval: {{ $.Values.podMonitor.interval }}
      scrapeTimeout: {{ $.Values.podMonitor.scrapeTimeout }}
      {{- with $.Values.podMonitor.relabelings }}
      relabelings:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with $.Values.podMonitor.metricRelabelings }}
      metricRelabelings:
        {{- toYaml . | nindent 8 }}
      {{- end }}
    {{- end }}
{{- end }}
